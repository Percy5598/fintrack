<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FinTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header>
    <h1>FinTrack</h1>
    <p class="sub">Freelancer &amp; small-business financial overview</p>
  </header>

  <main>
    <section class="cards" id="summary-cards">
      <div class="card"><h3>Income (net)</h3><p id="s-income">—</p></div>
      <div class="card"><h3>Expenses (net)</h3><p id="s-expenses">—</p></div>
      <div class="card"><h3>Profit (net)</h3><p id="s-profit">—</p></div>
      <div class="card"><h3>Margin</h3><p id="s-margin">—</p></div>
      <div class="card"><h3>VAT payable</h3><p id="s-vat">—</p></div>
    </section>

    <section class="panel">
      <h2>Add transaction</h2>
      <form id="tx-form">
        <select name="type" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <input name="category" placeholder="Category (e.g. Consulting)" required />
        <input name="description" placeholder="Description" />
        <input name="amount_net" type="number" step="0.01" placeholder="Net amount" required />
        <input name="vat_rate" type="number" step="0.01" value="0.24" placeholder="VAT rate (0.24)" />
        <label class="check">
          <input name="vat_deductible" type="checkbox" /> VAT deductible
        </label>
        <input name="date" type="date" required />
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="panel">
      <h2>Transactions</h2>
      <table id="tx-table">
        <thead>
          <tr>
            <th>Date</th><th>Type</th><th>Category</th>
            <th>Net</th><th>VAT</th><th>Gross</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
